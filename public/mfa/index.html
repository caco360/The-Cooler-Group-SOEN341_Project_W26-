<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Verification</title>

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <!-- Outer frame -->
      <section class="frame" aria-label="User Verification">
        <div class="panel">
          <h1 class="title">User Verification</h1>

          <!-- Request Code -->
          <div class="row">
            <form class="row-form" onsubmit="event.preventDefault(); requestOTP();">
              <input type="email" id="emailInput" name="email" class="pill-input" 
                     placeholder="example@example.com" required />
              <button type="submit" class="pill-btn">Request Code</button>
            </form>
          </div>

          <!-- Verify Code -->
          <div class="row">
            <form class="row-form" onsubmit="event.preventDefault(); verifyOTP();">
              <input type="text" id="codeInput" name="otp" class="pill-input" 
                     placeholder="Enter the Code" required />
              <button type="submit" class="pill-btn">Confirm</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script>
      async function requestOTP() {
        const email = document.getElementById('emailInput').value;
        
        const res = await fetch('/reqOTP', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        alert(data.message);
      }

      async function verifyOTP() {
        const email = document.getElementById('emailInput').value;
        const otp = document.getElementById('codeInput').value;
        
        const res = await fetch('/verifyOTP', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        
        const data = await res.json();
        alert(data.message);
      }
    </script>
  </body>
</html>
