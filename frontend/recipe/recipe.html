<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="recipe.css">
</head>

<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">Meal Major</h2>

      <nav data-app-nav>
        <a href="../profile/profile.html">Profile</a>
        <a href="recipe.html" class="active">Recipes</a>
        <a href="../meal-planner/meal-planner.html">Meal Planner</a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">

      <header class="page-header">
        <div class="header-left">
          <h1>Recipes</h1>
          <p id="subtitle">Your saved recipes will appear here</p>

          <div class="search-wrap">
            <input id="recipeSearch" type="search" placeholder="Search recipes by name" aria-label="Search recipes" />
          </div>

          <div class="search-actions">
            <button id="filterBtn" class="btn-secondary" type="button">Filter</button>
          </div>
        </div>

        <div class="header-actions">
          <button id="refreshBtn" class="btn-secondary" type="button">Refresh</button>
        </div>
      </header>

      <section class="add-recipes-section">
        <div class="add-recipes-header">
          <button
            id="toggleRecipeFormBtn"
            class="btn-secondary"
            type="button"
            aria-expanded="false"
            aria-controls="recipeFormPanel"
          >
            + Add Recipe
          </button>
        </div>

        <div id="recipeFormPanel" class="recipe-form-panel" hidden>
          <div class="recipe-form">
            <input type="text" id="titleInput" placeholder="Recipe title" />
            <input type="number" id="prepInput" placeholder="Prep time (minutes)" min="0" />
            <input type="number" id="costInput" placeholder="Cost ($)" min="0" step="0.01" />
            <textarea id="descInput" placeholder="Description"></textarea>
            <select id="dietSelect"><option value="">Loading...</option></select>

            <div class="ingredient-builder">
              <div class="ingredient-builder-header">
                <div>
                  <h3>Ingredients</h3>
                  <p>Search USDA foods, choose one, then enter grams.</p>
                </div>
                <button id="addIngredientBtn" class="btn-secondary" type="button">+ Add ingredient</button>
              </div>

              <div id="ingredientRows" class="ingredient-rows"></div>
            </div>

            <button id="addRecipeBtn" class="btn-secondary" type="button">Add Recipe</button>

            <span id="createMsg" class="status"></span>
          </div>
        </div>
      </section>
      
      <section class="recipes-section">
        <div class="section-top">
          <h2>Your Recipes</h2>
          <span id="status" class="status">Loading...</span>
        </div>

        <div id="recipesGrid" class="recipes-grid"></div>
      </section>

    </main>
  </div>

<script src="recipe.js"></script>
<script src="../loading/app-nav-transition.js"></script>


<!-- Filter modal -->
<div id="filterModal" class="modal" aria-hidden="true">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <h3 id="filterTitle">Filter recipes</h3>

    <label for="filterName">Name contains</label>
    <input id="filterName" type="text" placeholder="Recipe name" />
    <div class="filter-section">
      <label>Difficulty</label>
      <div class="filter-group" role="group" aria-label="Difficulty">
        <input type="checkbox" id="any" class="filter-check" />
        <label for="any" class="filter-label">Any</label>

        <input type="checkbox" id="easy" class="filter-check" />
        <label for="easy" class="filter-label">Easy</label>

        <input type="checkbox" id="medium" class="filter-check" />
        <label for="medium" class="filter-label">Medium</label>

        <input type="checkbox" id="hard" class="filter-check" />
        <label for="hard" class="filter-label">Hard</label>
      </div>
    </div>

    <!---Diet preferences filter-->
    <label>Diet preferences</label>

<div class="filter-group" role="group" aria-label="Diet preferences">
  <input type="checkbox" id="dietVegetarian" class="filter-check" />
  <label for="dietVegetarian" class="filter-label">Vegetarian</label>

  <input type="checkbox" id="dietVegan" class="filter-check" />
  <label for="dietVegan" class="filter-label">Vegan</label>

  <input type="checkbox" id="dietPescatarian" class="filter-check" />
  <label for="dietPescatarian" class="filter-label">Pescatarian</label>

  <input type="checkbox" id="dietGlutenFree" class="filter-check" />
  <label for="dietGlutenFree" class="filter-label">Gluten-Free</label>

  <input type="checkbox" id="dietDairyFree" class="filter-check" />
  <label for="dietDairyFree" class="filter-label">Dairy-Free</label>

  <input type="checkbox" id="dietNutFree" class="filter-check" />
  <label for="dietNutFree" class="filter-label">Nut-Free</label>

  <input type="checkbox" id="dietEggFree" class="filter-check" />
  <label for="dietEggFree" class="filter-label">Egg-Free</label>

  <input type="checkbox" id="dietKosher" class="filter-check" />
  <label for="dietKosher" class="filter-label">Kosher</label>

  <input type="checkbox" id="dietKeto" class="filter-check" />
  <label for="dietKeto" class="filter-label">Keto</label>
</div>


    <div style="height:8px"></div>

    <label for="filterCostRange">Cost</label>
    <div class="slider-filter">
      <input id="filterCostRange" class="range-slider" type="range" min="0" max="101" step="1" value="101" />
      <div class="slider-scale" aria-hidden="true">
        <span>$0</span>
        <span id="filterCostValue">$100+</span>
      </div>
    </div>
    <label>Calories</label>
<div class="cost-row">
  <input id="filterCaloriesMin" type="number" placeholder="Min" />
  <span class="cost-sep">—</span>
  <input id="filterCaloriesMax" type="number" placeholder="Max" />
</div>

    <div style="height:10px"></div>

    <label for="filterTimeRange">Prep time (minutes)</label>
    <div class="slider-filter">
      <input id="filterTimeRange" class="range-slider" type="range" min="0" max="121" step="1" value="121" />
      <div class="slider-scale" aria-hidden="true">
        <span>0 min</span>
        <span id="filterTimeValue">120+ min</span>
      </div>
    </div>

    <div class="modal-actions">
      <button id="applyFilterBtn" class="btn-secondary" type="button">Apply</button>
      <button id="cancelFilterBtn" class="btn-danger" type="button">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
