<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-transition.css">
</head>
<body>
  <main class="transition-shell" aria-live="polite">
    <div class="transition-orb transition-orb-left" aria-hidden="true"></div>
    <div class="transition-orb transition-orb-right" aria-hidden="true"></div>

    <section class="transition-card">
      <p class="transition-brand">Meal Major</p>
      <h1 id="transitionTitle">Opening your next page</h1>
      <p id="transitionCopy" class="transition-copy">Blurring the edges for a smoother switch.</p>
      <div class="transition-loader" aria-hidden="true">
        <span></span>
      </div>
    </section>
  </main>

  <script src="app-transition.js"></script>
</body>
</html>
