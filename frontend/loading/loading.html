<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="loading.css">
</head>
<body>
  <main class="loading-shell" aria-live="polite">
    <section class="loading-card">
      <p class="loading-brand">Meal Major</p>
      <h1>Loading your profile</h1>
      <p id="loadingMessage" class="loading-copy">Just a second while we get things ready.</p>
      <div class="loading-bar" aria-hidden="true">
        <span class="loading-bar-fill"></span>
      </div>
    </section>
  </main>

  <script src="loading.js"></script>
</body>
</html>
