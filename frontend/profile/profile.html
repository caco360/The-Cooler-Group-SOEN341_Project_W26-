<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profile.css">
</head>

<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Meal Major</h2>

    <nav>
      <a href="profile.html" class="active">Profile</a>
      <a href="../recipe/recipe.html">Recipes</a>
      <a href="../meal-planner/meal-planner.html">Meal Planner</a>
    </nav>

  </aside>


  <!-- Main -->
  <main class="main-content">

    <header>
      <h1 id="welcome">Loading...</h1>
      <p>Manage your preferences</p>
    </header>


    <!-- Allergies -->
    <section>

      <h2>Allergies</h2>

      <div class="input-row">
        <input id="newAllergy" placeholder="Add allergy..." />
        <button id="addAllergyBtn">Add</button>
      </div>

      <div id="allergiesBox" class="pill-box"></div>

    </section>


    <!-- Diet -->
    <section>

      <h2>Diet Preferences</h2>

      <div class="input-row">
        <input id="newDiet" placeholder="Add diet..." />
        <button id="addDietBtn">Add</button>
      </div>

      <div id="dietsBox" class="pill-box"></div>

    </section>

      <!-- Biometrics -->
    <section class="biometrics-section">
          <h2>Biometrics</h2>
          <div class="biometrics-input">

            <label for="ageInput">Age:</label>
            <label for="sexSelect">Sex:</label>
            <input type="number" id="ageInput" placeholder="Age" min="1" max="125" />
            <select id="sexSelect">
                <option value="" disabled selected>Select your sex...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <label for="goalSelect">Goal:</label>
            <label for="activityLevelSelect">Activity Level:</label>
            <select id="goalSelect">
                <option value="" disabled selected>Select your goal...</option>
                <option value="high_weight_gain">High Weight Gain</option>
                <option value="normal_weight_gain">Normal Weight Gain</option>
                <option value="maintain">Maintain</option>
                <option value="normal_weight_loss">Normal Weight Loss</option>
                <option value="extreme_weight_loss">Extreme Weight Loss</option>
            </select>
            <select id="activityLevelSelect">
                <option value="" disabled selected>Select your activity level...</option>
                <option value="no_exercise">No Exercise</option>
                <option value="light_1_2_days">Light Exercise 1-2 Days/Week</option>
                <option value="moderate_3_5_days">Moderate Exercise 3-5 Days/Week</option>
                <option value="intense_6_7_days">Intense Exercise 6-7 Days/Week</option>
                <option value="very_intense_job">Very Intense Exercise / Physical Job</option>
            </select>
            <label for="weightInput">Body Mass (in kilograms):</label>
            <label for="heightInput">Body Height (in meters):</label>
            <input type="number" id="weightInput" placeholder="Weight (kilograms)" min="1" max="700" step="0.001" />
            <input type="number" id="heightInput" placeholder="Height (meters)" min="0.5" max="3" step="0.001" />
    
            <label for="bmiResult">Body Mass Index (in kilograms per meters squared):</label>
            <label for="calorieGoalResult">Daily Calorie Goal (kcal/day):</label>
            <p>-~- Note: Ideal BMI value is *usually* between 18.5 and 24.9 -~-</p>
            <button id="calculateBMIBtn">Calculate BMI and Calorie Goal</button>
            <input type="text" id="bmiResult" value="" placeholder="BMI" readonly/>
            <input type="text" id="calorieGoalResult" value="" placeholder="Daily calorie goal" readonly/>
      
          </div>

      </section>


    <!-- Buttons -->
    <footer>

      <button id="saveBtn">Save Changes</button>

      <button id="logoutBtn">Sign Out</button>

      <button id="deleteBtn">Delete Account</button>

      <span id="msg"></span>

    </footer>


  </main>

</div>


<script src="profile.js"></script>
</body>
</html>
