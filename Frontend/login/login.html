<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="authentication.css" />

</head>

<body>
  <div class="container">
    <div class="login-box">
      <img src= "../images/MealMajor-logo.png" width="100" />
      <p>&nbsp;</p>
      <h2>Sign In</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>

        <p id="loginError" style="color:red; font-size:14px; min-height:18px;"></p>

        <button type="submit">Login</button>
        <p>&nbsp;</p>
        <p class="register">Don’t have an account? <a href="register.html">Sign Up</a></p>
        <p class="pwreset"><a href="forgot.html">Forgot password?</a></p>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
