<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="recipe.css">
</head>

<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">Meal Major</h2>

      <nav>
        <a href="../profile/profile.html">Profile</a>
        <a href="recipe.html" class="active">Recipes</a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">

      <header class="page-header">
        <div class="header-left">
          <h1>Recipes</h1>
          <p id="subtitle">Your saved recipes will appear here</p>
        </div>

        <div class="header-actions">
          <button id="refreshBtn" class="btn-secondary" type="button">Refresh</button>
        </div>
      </header>

      <section class="recipes-section">
        <div class="section-top">
          <h2>Your Recipes</h2>
          <span id="status" class="status">Loading...</span>
        </div>

        <!-- Time filter -->
        <div id="recipes-filter" class="recipes-filter">
          <label for="timeFilter">Max prep time (minutes)</label>
          <input
            type="number"
            id="timeFilter"
            min="0"
            placeholder="e.g. 30"
          />
        </div>

        <div id="recipesGrid" class="recipes-grid"></div>
      </section>

    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", init);

    let allRecipes = [];

    function init() {
      document.getElementById("refreshBtn").addEventListener("click", loadRecipes);
      document.getElementById("timeFilter").addEventListener("input", filterByTime);
      loadRecipes();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadRecipes() {
      const statusEl = document.getElementById("status");
      const grid = document.getElementById("recipesGrid");

      statusEl.classList.remove("error");
      statusEl.textContent = "Loading...";
      grid.innerHTML = "";

      const meRes = await fetch("/me");
      if (meRes.status === 401) {
        window.location.href = "/login/login.html";
        return;
      }

      try {
        const res = await fetch("/my-recipes");

        if (res.status === 401) {
          window.location.href = "/login/login.html";
          return;
        }

        const data = await res.json();

        if (!data.ok) {
          statusEl.classList.add("error");
          statusEl.textContent = "Could not load recipes.";
          return;
        }

        allRecipes = data.recipes || [];

        if (!allRecipes.length) {
          statusEl.textContent = "No recipes saved yet.";
          return;
        }

        statusEl.textContent = "";
        renderRecipes(allRecipes);

      } catch (err) {
        console.error(err);
        statusEl.classList.add("error");
        statusEl.textContent = "Server error.";
      }
    }

    function renderRecipes(recipes) {
      const grid = document.getElementById("recipesGrid");
      const statusEl = document.getElementById("status");

      if (!recipes.length) {
        grid.innerHTML = "";
        statusEl.textContent = "No recipes match that time.";
        return;
      }

      statusEl.textContent = "";

      grid.innerHTML = recipes.map(r => {
        const title = escapeHtml(r.title || "Untitled");
        const desc = r.description ? escapeHtml(r.description) : "";
        const prep = (r.prep_time === null || r.prep_time === undefined || r.prep_time === "")
          ? "—"
          : `${escapeHtml(r.prep_time)} min`;

        const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        const ingHtml = ingredients.length
          ? ingredients.map(i => `<span class="ingredient-pill">${escapeHtml(i)}</span>`).join("")
          : `<span class="muted">No ingredients listed</span>`;

        return `
          <article class="recipe-card" data-id="${r.id}">
            <div class="recipe-top">
              <div class="title-wrap">
                <h3 class="recipe-title">${title}</h3>
                <span class="prep-badge">${prep}</span>
              </div>

              <div class="card-actions">
                <button class="btn-secondary" type="button" data-action="edit" data-id="${r.id}">
                  Edit
                </button>
                <button class="btn-danger" type="button" data-action="delete" data-id="${r.id}">
                  Delete
                </button>
              </div>
            </div>

            <p class="recipe-desc ${desc ? "" : "muted"}">
              ${desc || "No description"}
            </p>

            <div class="ingredients-block">
              <div class="ingredients-label">Ingredients</div>
              <div class="ingredients-pills">
                ${ingHtml}
              </div>
            </div>
          </article>
        `;
      }).join("");

      grid.querySelectorAll('button[data-action="delete"]').forEach(btn => {
        btn.addEventListener("click", () => deleteRecipe(btn.dataset.id));
      });

      grid.querySelectorAll('button[data-action="edit"]').forEach(btn => {
        btn.addEventListener("click", () => startEdit(btn.dataset.id));
      });
    }

    function filterByTime() {
      const value = document.getElementById("timeFilter").value;
      const maxTime = Number(value);

      if (!value) {
        renderRecipes(allRecipes);
        return;
      }

      const filtered = allRecipes.filter(r => {
        if (r.prep_time === null || r.prep_time === undefined || r.prep_time === "") {
          return false;
        }
        return Number(r.prep_time) <= maxTime;
      });

      renderRecipes(filtered);
    }

    async function deleteRecipe(recipeId) {
      const ok = confirm("Delete this recipe?");
      if (!ok) return;

      try {
        const res = await fetch(`/recipes/${recipeId}`, { method: "DELETE" });

        if (res.status === 401) {
          window.location.href = "/login/login.html";
          return;
        }

        const data = await res.json();

        if (!data.ok) {
          alert(data.message || "Delete failed.");
          return;
        }

        allRecipes = allRecipes.filter(r => String(r.id) !== String(recipeId));
        renderAfterEdit();

      } catch (err) {
        console.error(err);
        alert("Server error.");
      }
    }

    /* =====================
       Inline editing
    ===================== */

    function startEdit(recipeId) {

      const card = document.querySelector(`.recipe-card[data-id="${recipeId}"]`);
      const recipe = allRecipes.find(r => String(r.id) === String(recipeId));

      if (!card || !recipe) return;

      const ingredients = Array.isArray(recipe.ingredients)
        ? recipe.ingredients.join(", ")
        : "";

      card.innerHTML = `
        <div class="recipe-edit-form">

          <div class="form-row">
            <label>Title</label>
            <input class="edit-title" type="text" value="${escapeHtml(recipe.title || "")}">
          </div>

          <div class="form-row">
            <label>Description</label>
            <textarea class="edit-desc">${escapeHtml(recipe.description || "")}</textarea>
          </div>

          <div class="form-row">
            <label>Prep time (minutes)</label>
            <input class="edit-prep" type="number" min="0" value="${recipe.prep_time ?? ""}">
          </div>

          <div class="form-row">
            <label>Ingredients (comma separated)</label>
            <input class="edit-ingredients" type="text" value="${escapeHtml(ingredients)}">
          </div>

          <div class="edit-actions">
            <button class="btn-secondary" type="button" data-action="cancel">Cancel</button>
            <button class="btn-primary" type="button" data-action="save">Save</button>
          </div>

        </div>
      `;

      card.querySelector('[data-action="cancel"]')
        .addEventListener("click", renderAfterEdit);

      card.querySelector('[data-action="save"]')
        .addEventListener("click", () => saveEdit(recipeId));
    }

    async function saveEdit(recipeId) {

      const card = document.querySelector(`.recipe-card[data-id="${recipeId}"]`);
      if (!card) return;

      const title = card.querySelector(".edit-title").value.trim();
      const description = card.querySelector(".edit-desc").value.trim();
      const prepRaw = card.querySelector(".edit-prep").value;
      const ingredientsRaw = card.querySelector(".edit-ingredients").value;

      const ingredients = ingredientsRaw
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      const payload = {
        title,
        description,
        prep_time: prepRaw === "" ? null : Number(prepRaw),
        ingredients
      };

      try {
        const res = await fetch(`/recipes/${recipeId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.status === 401) {
          window.location.href = "/login/login.html";
          return;
        }

        const data = await res.json();

        if (!data.ok) {
          alert(data.message || "Update failed.");
          return;
        }

        const idx = allRecipes.findIndex(r => String(r.id) === String(recipeId));
        if (idx !== -1) {
          allRecipes[idx] = {
            ...allRecipes[idx],
            ...payload
          };
        }

        renderAfterEdit();

      } catch (err) {
        console.error(err);
        alert("Server error.");
      }
    }

    function renderAfterEdit() {
      const value = document.getElementById("timeFilter").value;

      if (!value) {
        renderRecipes(allRecipes);
      } else {
        filterByTime();
      }
    }

  </script>
</body>
</html>
