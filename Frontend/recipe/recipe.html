<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recipes</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipe.css">
</head>

<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Meal Major</h2>

    <nav>
      <a href="../profile/profile.html">Profile</a>
      <a href="recipe.html" class="active">Recipes</a>
    </nav>

  </aside>


  <!-- Main -->
  <main class="main-content">

    <header>
      <h1>Recipes</h1>
      <p>Your saved recipes will appear here</p>
    </header>


    <section>

      <section>
  <h2>Your Recipes</h2>
  <div id="recipesContainer"></div>
</section>

<script>
document.addEventListener("DOMContentLoaded", loadRecipes);

async function loadRecipes() {

  const container = document.getElementById("recipesContainer");
  container.innerHTML = "Loading...";

  try {

    const res = await fetch("/my-recipes");

    if (res.status === 401) {
      window.location.href = "/login/login.html";
      return;
    }

    const data = await res.json();

    if (!data.ok) {
      container.innerHTML = "Error loading recipes.";
      return;
    }

    if (!data.recipes.length) {
      container.innerHTML = "<p>No recipes saved yet.</p>";
      return;
    }

    container.innerHTML = data.recipes.map(r => `
      <div class="recipe-card">
        <h3>${r.title}</h3>
        <p>${r.description || "No description"}</p>
        <p><strong>Prep:</strong> ${r.prep_time || "-"} min</p>
        <div class="ingredient-box">
          ${(r.ingredients || []).map(i => `<span class="ingredient-pill">${i}</span>`).join("")}
        </div>
      </div>
    `).join("");

  } catch (err) {
    console.error(err);
    container.innerHTML = "Server error.";
  }
}
</script>

  </main>

</div>

</body>
</html>
