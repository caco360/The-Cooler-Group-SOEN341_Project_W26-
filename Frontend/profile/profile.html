<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profile.css">
</head>

<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2 class="logo">Meal Major</h2>

    <nav>
      <a href="profile.html" class="active">Profile</a>
      <a href="../recipe/recipe.html">Recipes</a>
      <a href="../meal_planner/meal_planner.html">Meal Planner</a>
    </nav>

  </aside>


  <!-- Main -->
  <main class="main-content">

    <header>
      <h1 id="welcome">Loading...</h1>
      <p>Manage your preferences</p>
    </header>


    <!-- Allergies -->
    <section>

      <h2>Allergies</h2>

      <div class="input-row">
        <input id="newAllergy" placeholder="Add allergy..." />
        <button id="addAllergyBtn">Add</button>
      </div>

      <div id="allergiesBox" class="pill-box"></div>

    </section>


    <!-- Diet -->
    <section>

      <h2>Diet Preferences</h2>

      <div class="input-row">
        <input id="newDiet" placeholder="Add diet..." />
        <button id="addDietBtn">Add</button>
      </div>

      <div id="dietsBox" class="pill-box"></div>

    </section>


    <!-- Buttons -->
    <footer>

      <button id="saveBtn">Save Changes</button>

      <button id="logoutBtn">Sign Out</button>

      <button id="deleteBtn">Delete Account</button>

      <span id="msg"></span>

    </footer>


  </main>

</div>


<script src="profile.js"></script>
</body>
</html>
